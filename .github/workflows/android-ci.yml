name: Android CI

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit rather than relying on the action's own default
          # (which included the legacy "tools" package) — Google has
          # fully removed "tools" from the SDK repository (superseded
          # years ago by cmdline-tools/platform-tools/build-tools), so
          # requesting it now fails outright. platform-tools alone is
          # enough here; Gradle resolves whatever compileSdk/build-tools
          # packages it actually needs itself during the build, against
          # the already-accepted licenses.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Upload test/build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
